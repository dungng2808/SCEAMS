<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">SCEAMS entity relationship diagram</title>
  <desc id="desc">Users, clubs, events, venues, registrations, attendance, feedback, notifications and chat logs with primary and foreign keys.</desc>
  <defs><style>.box{fill:#f7fbff;stroke:#17365d;stroke-width:2}.head{fill:#17365d}.name{font:700 16px Arial;fill:#fff}.field{font:13px Consolas,monospace;fill:#1f2937}.rel{stroke:#5b6573;stroke-width:2;fill:none;marker-end:url(#arrow)}.label{font:12px Arial;fill:#374151}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6573"/></marker></defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <g transform="translate(35 40)"><rect class="box" width="250" height="145" rx="10"/><rect class="head" width="250" height="34"/><text class="name" x="14" y="23">USERS</text><text class="field" x="14" y="58">PK Id</text><text class="field" x="14" y="80">UK Email</text><text class="field" x="14" y="102">Role</text><text class="field" x="14" y="124">PasswordHash</text></g>
  <g transform="translate(35 275)"><rect class="box" width="250" height="120" rx="10"/><rect class="head" width="250" height="34"/><text class="name" x="14" y="23">CLUB_CATEGORIES</text><text class="field" x="14" y="58">PK Id</text><text class="field" x="14" y="80">UK Name</text><text class="field" x="14" y="102">Description</text></g>
  <g transform="translate(350 55)"><rect class="box" width="280" height="175" rx="10"/><rect class="head" width="280" height="34"/><text class="name" x="14" y="23">CLUBS</text><text class="field" x="14" y="58">PK Id</text><text class="field" x="14" y="80">FK CategoryId</text><text class="field" x="14" y="102">FK CreatedByUserId</text><text class="field" x="14" y="124">Status</text><text class="field" x="14" y="146">CreatedAt</text></g>
  <g transform="translate(350 310)"><rect class="box" width="280" height="155" rx="10"/><rect class="head" width="280" height="34"/><text class="name" x="14" y="23">CLUB_MEMBERSHIPS</text><text class="field" x="14" y="58">PK Id</text><text class="field" x="14" y="80">FK ClubId</text><text class="field" x="14" y="102">FK StudentId</text><text class="field" x="14" y="124">Status</text></g>
  <g transform="translate(350 560)"><rect class="box" width="280" height="145" rx="10"/><rect class="head" width="280" height="34"/><text class="name" x="14" y="23">VENUES</text><text class="field" x="14" y="58">PK Id</text><text class="field" x="14" y="80">Name + Location</text><text class="field" x="14" y="102">Capacity</text><text class="field" x="14" y="124">IsUnderMaintenance</text></g>
  <g transform="translate(720 45)"><rect class="box" width="300" height="190" rx="10"/><rect class="head" width="300" height="34"/><text class="name" x="14" y="23">EVENTS</text><text class="field" x="14" y="58">PK Id</text><text class="field" x="14" y="80">FK ClubId, VenueId</text><text class="field" x="14" y="102">FK CreatedByUserId</text><text class="field" x="14" y="124">StartTime / EndTime</text><text class="field" x="14" y="146">RegistrationDeadline</text><text class="field" x="14" y="168">Status, Capacity</text></g>
  <g transform="translate(720 300)"><rect class="box" width="300" height="155" rx="10"/><rect class="head" width="300" height="34"/><text class="name" x="14" y="23">REGISTRATIONS</text><text class="field" x="14" y="58">PK Id</text><text class="field" x="14" y="80">FK EventId</text><text class="field" x="14" y="102">FK StudentId</text><text class="field" x="14" y="124">UK EventId + StudentId</text></g>
  <g transform="translate(720 520)"><rect class="box" width="300" height="120" rx="10"/><rect class="head" width="300" height="34"/><text class="name" x="14" y="23">ATTENDANCES</text><text class="field" x="14" y="58">PK Id / UK RegistrationId</text><text class="field" x="14" y="80">FK CheckedInByUserId</text><text class="field" x="14" y="102">CheckInTime</text></g>
  <g transform="translate(1080 280)"><rect class="box" width="270" height="130" rx="10"/><rect class="head" width="270" height="34"/><text class="name" x="14" y="23">FEEDBACKS</text><text class="field" x="14" y="58">PK Id</text><text class="field" x="14" y="80">FK EventId, StudentId</text><text class="field" x="14" y="102">UK EventId + StudentId</text></g>
  <g transform="translate(1080 495)"><rect class="box" width="270" height="130" rx="10"/><rect class="head" width="270" height="34"/><text class="name" x="14" y="23">NOTIFICATION_DELIVERIES</text><text class="field" x="14" y="58">PK Id / FK EventId</text><text class="field" x="14" y="80">NotificationType</text><text class="field" x="14" y="102">CorrelationId (unique)</text></g>
  <g transform="translate(1080 710)"><rect class="box" width="270" height="120" rx="10"/><rect class="head" width="270" height="34"/><text class="name" x="14" y="23">CHAT_LOGS</text><text class="field" x="14" y="58">PK Id / FK StudentId</text><text class="field" x="14" y="80">Question, AnswerText</text><text class="field" x="14" y="102">CreatedAt</text></g>
  <path class="rel" d="M285 95 L350 120"/><path class="rel" d="M285 335 L350 135"/><path class="rel" d="M285 125 L350 385"/><path class="rel" d="M630 140 L720 140"/><path class="rel" d="M630 600 L720 160"/><path class="rel" d="M630 140 L720 350"/><path class="rel" d="M1020 365 L1080 345"/><path class="rel" d="M1020 160 L1080 540"/><path class="rel" d="M870 455 L870 520"/><path class="rel" d="M250 150 C520 760 930 770 1080 770"/>
  <text class="label" x="292" y="88">1:N</text><text class="label" x="650" y="130">1:N</text><text class="label" x="880" y="490">1:1</text><text class="label" x="640" y="790">1:N</text>
</svg>
